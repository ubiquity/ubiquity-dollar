name: Check For Core Contracts Storage Changes

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  provide_contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Narrow down test matrix scope to changed contracts to limit API requests
        id: changed-contracts
        uses: tj-actions/changed-files@v42
        with:
          files_yaml: |
            contracts:
              - packages/contracts/src/dollar/core/*.sol

      - name: Filter out new contracts (no baseline available)
        id: set-matrix
        working-directory: packages/contracts
        if: steps.changed-contracts.outputs.contracts_any_changed == 'true'
        env:
          CHANGED_CONTRACTS: ${{ steps.changed-contracts.outputs.contracts_all_changed_files }}
        run: |
          # Fetch base branch to check if contracts exist there
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          for CONTRACT in $CHANGED_CONTRACTS; do
            CONTRACT_NAME=$(basename "$CONTRACT" .sol)
            CONTRACT_PATH="packages/contracts/src/dollar/core/${CONTRACT_NAME}.sol"
            # Check if contract exists on base branch
            if git cat-file -e "${BASE_REF}:${CONTRACT_PATH}" 2>/dev/null; then
              echo "✅ ${CONTRACT_NAME} exists on base - will check storage"
              echo "src/dollar/core/${CONTRACT_NAME}.sol:${CONTRACT_NAME}" >> contracts.txt
            else
              echo "⏭️ ${CONTRACT_NAME} is NEW - skipping storage check (no baseline)"
            fi
          done

          if [ -f contracts.txt ] && [ -s contracts.txt ]; then
            echo "matrix=$(cat contracts.txt | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
          fi

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  check_storage_layout:
    needs: provide_contracts
    runs-on: ubuntu-latest
    if: ${{ needs.provide_contracts.outputs.matrix != '[]' && needs.provide_contracts.outputs.matrix != '' }}

    strategy:
      matrix:
        contract: ${{ fromJSON(needs.provide_contracts.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Generate baseline storage layout
        working-directory: packages/contracts
        run: |
          CONTRACT_PATH=$(echo "${{ matrix.contract }}" | cut -d: -f1)
          CONTRACT_NAME=$(echo "${{ matrix.contract }}" | cut -d: -f2)
          echo "Checking storage layout for ${CONTRACT_NAME}"

      - name: Check For Core Contracts Storage Changes
        uses: Rubilmax/foundry-storage-check@main
        with:
          workingDirectory: packages/contracts
          contract: ${{ matrix.contract }}
          failOnRemoval: true
        continue-on-error: true

      - name: Upload storage layout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-layout-${{ strategy.job-index }}
          path: packages/contracts/storage-layout.json
          retention-days: 7
