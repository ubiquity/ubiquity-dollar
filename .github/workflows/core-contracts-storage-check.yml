name: Check For Core Contracts Storage Changes

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  provide_contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Narrow down test matrix scope to changed contracts to limit API requests
        id: changed-contracts
        uses: tj-actions/changed-files@v42
        with:
          files_yaml: |
            contracts:
              - packages/contracts/src/dollar/core/*.sol

      - name: Set contracts matrix (excluding newly added contracts)
        id: set-matrix
        working-directory: packages/contracts
        if: steps.changed-contracts.outputs.contracts_any_changed == 'true'
        env:
          CHANGED_CONTRACTS: ${{ steps.changed-contracts.outputs.contracts_all_changed_files }}
          ADDED_CONTRACTS: ${{ steps.changed-contracts.outputs.contracts_added_files }}
        run: |
          # Build lookup of newly-added contracts (files that didn't exist on the base branch).
          # For newly-added contracts there is no prior storage-layout artifact to compare
          # against, so including them would cause the action to fail with:
          #   "No workflow run found with an artifact named ..."
          # We intentionally skip them — a new contract has no upgrade history, so
          # storage-collision checks are not applicable yet.
          declare -A ADDED_SET
          for ADDED in $ADDED_CONTRACTS; do
            ADDED_SET["$ADDED"]=1
          done

          for CONTRACT in $CHANGED_CONTRACTS; do
            if [ -z "${ADDED_SET[$CONTRACT]+_}" ]; then
              echo ${CONTRACT} | xargs basename -a | cut -d'.' -f1 | xargs -I{} echo src/dollar/core/{}.sol:{} >> contracts.txt
            else
              echo "Skipping newly-added contract (no prior storage artifact): $CONTRACT"
            fi
          done

          if [ -f contracts.txt ]; then
            echo "matrix=$(cat contracts.txt | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
          fi

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  check_storage_layout:
    needs: provide_contracts
    runs-on: ubuntu-latest
    if: ${{ needs.provide_contracts.outputs.matrix != '[]' && needs.provide_contracts.outputs.matrix != '' }}

    strategy:
      matrix:
        contract: ${{ fromJSON(needs.provide_contracts.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        
      - name: Check For Core Contracts Storage Changes
        uses: Rubilmax/foundry-storage-check@main
        with:
          workingDirectory: packages/contracts
          contract: ${{ matrix.contract }}
          failOnRemoval: true
