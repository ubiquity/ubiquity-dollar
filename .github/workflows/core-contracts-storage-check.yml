name: Check For Core Contracts Storage Changes

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  provide_contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Narrow down test matrix scope to changed contracts to limit API requests
        id: changed-contracts
        uses: tj-actions/changed-files@v42
        with:
          files_yaml: |
            contracts:
              - packages/contracts/src/dollar/core/*.sol

      - name: Set contracts matrix
        id: set-matrix
        working-directory: packages/contracts
        if: steps.changed-contracts.outputs.contracts_any_changed == 'true'
        env:
          CHANGED_CONTRACTS: ${{ steps.changed-contracts.outputs.contracts_all_changed_files }}
        run: |
          BASE_REF="${{ github.base_ref }}"
          [ -z "$BASE_REF" ] && BASE_REF="${{ github.event.repository.default_branch }}"
          for CONTRACT in $CHANGED_CONTRACTS; do
            CONTRACT_NAME=$(echo "$CONTRACT" | xargs basename -a | cut -d'.' -f1)
            CONTRACT_PATH="src/dollar/core/${CONTRACT_NAME}.sol"
            # Skip newly added contracts that don't exist on the base branch
            if [ -n "$BASE_REF" ]; then
              if ! git show "origin/${BASE_REF}:${CONTRACT}" > /dev/null 2>&1; then
            echo "Skipping newly added contract: ${CONTRACT_NAME}"
            continue
              fi
            fi
            echo "${CONTRACT_PATH}:${CONTRACT_NAME}" >> contracts.txt
          done
          echo "matrix=$(cat contracts.txt 2>/dev/null | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  check_storage_layout:
    needs: provide_contracts
    runs-on: ubuntu-latest
    if: ${{ needs.provide_contracts.outputs.matrix != '[]' && needs.provide_contracts.outputs.matrix != '' }}

    strategy:
      matrix:
        contract: ${{ fromJSON(needs.provide_contracts.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        
      - name: Check For Core Contracts Storage Changes
        uses: Rubilmax/foundry-storage-check@main
        with:
          workingDirectory: packages/contracts
          contract: ${{ matrix.contract }}
          failOnRemoval: true
          
