name: Check For Diamond Storage Changes

on:
  push:
    branches:
      - development
    paths:
      - '**.sol'
  pull_request:
    paths:
      - '**.sol'

jobs:
  provide_contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Narrow down test matrix scope to changed Dollar libraries to limit API requests
        id: changed-libraries
        uses: tj-actions/changed-files@v42
        with:
          files_yaml: |
            libraries:
              - packages/contracts/src/dollar/libraries/Lib*.sol

      - name: Identify newly added libraries (skip storage check — no prior artifact exists)
        id: new-libraries
        if: steps.changed-libraries.outputs.libraries_any_changed == 'true'
        run: |
          NEW_LIBS="${{ steps.changed-libraries.outputs.libraries_all_added_files }}"
          if [ -n "$NEW_LIBS" ]; then
            for FILE in $NEW_LIBS; do
              if echo "$FILE" | grep -q '\.sol$'; then
                echo "$(echo $FILE | xargs basename -a | cut -d'.' -f1)" >> new_libs.txt
              fi
            done
          fi
          echo "new=$(cat new_libs.txt 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Set contracts matrix
        id: set-matrix
        working-directory: packages/contracts
        if: steps.changed-libraries.outputs.libraries_any_changed == 'true'
        env:
          CHANGED_LIBS: ${{ steps.changed-libraries.outputs.libraries_all_changed_files }}
          NEW_LIBS: ${{ steps.new-libraries.outputs.new }}
        run: |
          NEW_SET=""
          if [ -n "$NEW_LIBS" ]; then
            for NL in $NEW_LIBS; do
              NEW_SET="$NEW_SET $NL"
            done
          fi
          for DIAMOND_LIB in $CHANGED_LIBS; do
            LIB_NAME=$(echo $DIAMOND_LIB | xargs basename -a | cut -d'.' -f1)
            # Skip new libraries — they have no prior storage artifact
            if echo "$NEW_SET" | grep -qw "$LIB_NAME"; then
              echo "Skipping new library: $LIB_NAME"
              continue
            fi
            echo "src/dollar/libraries/${DIAMOND_LIB##*/}:${LIB_NAME}" >> contracts.txt
          done
          echo "matrix=$(cat contracts.txt 2>/dev/null | jq -R -s -c 'split("\n")[:-1]' || echo '[]')" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  check_storage_layout:
    needs: provide_contracts
    runs-on: ubuntu-latest
    if: ${{ needs.provide_contracts.outputs.matrix != '[]' && needs.provide_contracts.outputs.matrix != '' }}

    strategy:
      matrix:
        contract: ${{ fromJSON(needs.provide_contracts.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        
      - name: Check For Diamond Storage Changes
        uses: ubiquity/foundry-storage-check@main
        with:
          workingDirectory: packages/contracts
          contract: ${{ matrix.contract }}
          failOnRemoval: true
          failOnLabelDiff: true
