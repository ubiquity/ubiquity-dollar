name: Check storage layout
author: Rubilmax
description: Compare storage layout reports generated by foundry.
branding:
  icon: info
  color: purple

inputs:
  contract:
    description: The path and name of the contract to inspect, e.g. src/Contract.sol:Contract.
    required: true
  address:
    description: The deployed contract address queried via rpcUrl for storage clash checks.
    required: false
  rpcUrl:
    description: The HTTP or WS URL used to query the EVM-compatible chain.
    required: false
  failOnRemoval:
    description: Whether to fail when a storage slot is removed.
    required: false
    default: false
  failOnLabelDiff:
    description: Whether to fail when a label diff warning occurs.
    required: false
    default: false
  token:
    description: The repository GitHub token.
    default: ${{ github.token }}
    required: false
  base:
    description: The storage layout reference branch name.
    default: ${{ github.base_ref || github.ref_name }}
    required: false
  head:
    description: The storage layout target branch name.
    default: ${{ github.head_ref || github.ref_name }}
    required: false
  workingDirectory:
    description: The directory inside which to run forge inspect.
    default: .
    required: false

runs:
  using: node16
  main: dist/index.js
